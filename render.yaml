services:
  - type: web
    name: autoloto
    runtime: node
    plan: free
    buildCommand: NODE_ENV=development npm install && npm run build
    startCommand: node backend/dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: OPENAI_API_KEY
        sync: false
      - key: DASHSCOPE_API_KEY
        sync: false
